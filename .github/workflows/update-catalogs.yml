name: Update Rock & Metal Documentary Catalogs

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    paths:
      - "scripts/build_catalogs.py"
      - "overrides.json"

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build static Nuvio catalogs
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          TORBOX_API_KEY: ${{ secrets.TORBOX_API_KEY }}
        run: python scripts/build_catalogs.py

      - name: Commit and push updated catalogs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A docs/
          if ! git diff --staged --quiet; then
            git commit -m "chore: update documentary catalogs"
            git push
          else
            echo "No catalog changes detected."
          fi
